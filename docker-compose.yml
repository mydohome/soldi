services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-soldi}
      POSTGRES_PASSWORD: ${PGPASSWORD:-soldi}
      POSTGRES_DB: ${PGDATABASE:-soldi}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-soldi} -d ${PGDATABASE:-soldi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-soldi}
      PGPASSWORD: ${PGPASSWORD:-soldi}
      PGDATABASE: ${PGDATABASE:-soldi}
      JWT_SECRET: ${JWT_SECRET:?imposta JWT_SECRET nel file .env}
      # true solo se l'app è raggiunta via HTTPS (diretto o reverse proxy).
      # Con false (default) niente HSTS né upgrade-insecure-requests: necessario
      # per un deploy in HTTP puro (http://server:3010).
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * 0}
      BACKUP_KEEP: ${BACKUP_KEEP:-8}
      BACKUP_DIR: /app/backups
      TZ: ${TZ:-Europe/Rome}
      # Aggiornamento dall'app (Impostazioni → Aggiorna). true = attivo.
      # Richiede i mount qui sotto: fa `git pull` + riavvio, senza rebuild dell'immagine.
      SELF_UPDATE_ENABLED: ${SELF_UPDATE_ENABLED:-false}
    ports:
      # <porta pubblicata sull'host>:<porta interna del container, fissa>
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./backups:/app/backups
      # Aggiornamento dall'app: il repo è montato su /repo e il suo codice
      # (src/public) direttamente su /app, così `git pull` + riavvio aggiorna
      # l'app senza ricostruire l'immagine.
      - .:/repo
      - ./src:/app/src
      - ./public:/app/public

volumes:
  db-data:
