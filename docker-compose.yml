services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-soldi}
      POSTGRES_PASSWORD: ${PGPASSWORD:-soldi}
      POSTGRES_DB: ${PGDATABASE:-soldi}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-soldi} -d ${PGDATABASE:-soldi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-soldi}
      PGPASSWORD: ${PGPASSWORD:-soldi}
      PGDATABASE: ${PGDATABASE:-soldi}
      JWT_SECRET: ${JWT_SECRET:?imposta JWT_SECRET nel file .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * 0}
      BACKUP_KEEP: ${BACKUP_KEEP:-8}
      BACKUP_DIR: /app/backups
      TZ: ${TZ:-Europe/Rome}
    ports:
      # <porta pubblicata sull'host>:<porta interna del container, fissa>
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./backups:/app/backups

volumes:
  db-data:
