name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soldi
          POSTGRES_PASSWORD: soldi
          POSTGRES_DB: soldi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soldi -d soldi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Test di integrazione (Postgres)
        run: npm run test:integration
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: soldi
          PGPASSWORD: soldi
          PGDATABASE: soldi_test

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker network create proxy-net >/dev/null 2>&1 || true
          docker compose -f docker-compose.npm.yml config --quiet
        env:
          JWT_SECRET: ci-placeholder-secret-value

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t soldi:ci .
